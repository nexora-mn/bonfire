# Local Typesense for the search service: `make typesense`.
# The API key must match TypesenseAPIKey in .secrets.local.cue.
services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    command:
      - --data-dir=/data
      - --api-key=bonfire-local
      - --enable-cors
      # Popular/no-hit query aggregation and click counters.
      - --enable-search-analytics=true
      - --analytics-dir=/data/analytics
      - --analytics-flush-interval=60

volumes:
  typesense-data:
