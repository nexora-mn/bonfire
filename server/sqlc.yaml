version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "encore.dev/types/uuid"
          type: "UUID"

      - db_type: "uuid"
        nullable: true
        go_type:
          import: "encore.dev/types/uuid"
          type: "UUID"
          pointer: true

      - db_type: "pg_catalog.timestamptz"
        go_type: "time.Time"

      - db_type: "pg_catalog.timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true

      - db_type: "timestamptz"
        go_type: "time.Time"

      - db_type: "timestamptz"
        nullable: true
        go_type:
          type: "time.Time"
          pointer: true

      - db_type: "date"
        go_type: "time.Time"

      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true

      - column: "payout_accounts.account_number"
        go_struct_tag: 'encore:"sensitive"'

      - column: "payouts.account_number"
        go_struct_tag: 'encore:"sensitive"'
sql:
  - engine: "postgresql"
    queries: "./persistence/queries"
    schema: "./persistence/migrations"
    gen:
      go:
        sql_package: "pgx/v5"
        package: "persistence"
        out: "persistence"
        emit_interface: false
        emit_pointers_for_null_types: false
        emit_json_tags: true
        emit_empty_slices: true
        json_tags_case_style: "camel"
