# Copy to secrets.yaml (gitignored), fill in, then `make secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: bonfire-server
  namespace: bonfire
type: Opaque
stringData:
  # Used in a connection URL, so keep it URL-safe: openssl rand -hex 32
  DB_PASSWORD: ""
  # https://<ref>.supabase.co
  SUPABASE_URL: ""
  # S3-compatible credentials for the creator-media bucket.
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
